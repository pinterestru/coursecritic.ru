name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REPO_NAME: ${{ github.event.repository.name }}
  # Per-repo variables (Settings -> Secrets and variables -> Actions -> Variables):
  #   SITE_CONFIG  e.g. coursecritic / edsider
  #   PORT         must match the upstream in nginx.conf.<site> e.g. 3005 / 3006
  SITE_CONFIG: ${{ vars.SITE_CONFIG }}
  PORT: ${{ vars.PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate config
        run: |
          if [ -z "${SITE_CONFIG}" ]; then
            echo "::error::Repo variable SITE_CONFIG is not set. Set it in Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          if [ -z "${PORT}" ]; then
            echo "::error::Repo variable PORT is not set. Set it in Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Resolve deploy vars
        run: |
          SAFE_REPO_NAME=$(echo "${REPO_NAME}" | tr '.' '_')
          echo "SAFE_REPO_NAME=${SAFE_REPO_NAME}" >> $GITHUB_ENV
          echo "BUILD_ID=$(date +%s)" >> $GITHUB_ENV
          echo "IMAGE_NAME=${REPO_NAME}-${SITE_CONFIG}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker buildx build --platform=linux/amd64 --load \
            -t "${IMAGE_NAME}:${{ github.sha }}" \
            -t "${IMAGE_NAME}:latest" \
            --cache-from type=inline \
            --cache-to type=inline \
            --build-arg SITE_CONFIG="${SITE_CONFIG}" \
            --build-arg PORT="${PORT}" \
            --build-arg LOG_LEVEL="${{ vars.LOG_LEVEL || 'info' }}" \
            --build-arg API_BASE_URL="${{ vars.API_BASE_URL }}" \
            --build-arg API_MEDIA_URL="${{ vars.API_MEDIA_URL || vars.API_BASE_URL }}" \
            .

      - name: Stream image to VPS
        run: |
          docker save "${IMAGE_NAME}:${{ github.sha }}" | gzip | \
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} 'gunzip | docker load'

      - name: Copy compose file
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: 'docker-compose.production.yml'
          target: '/opt/apps/${{ env.SAFE_REPO_NAME }}-${{ env.SITE_CONFIG }}'

      - name: Compose up on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            SITE="${{ env.SITE_CONFIG }}"
            PORT="${{ env.PORT }}"
            APP_DIR="/opt/apps/${{ env.SAFE_REPO_NAME }}-${SITE}"
            IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ github.sha }}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            cat > .env <<EOF
            NODE_ENV=production
            SITE_CONFIG=${SITE}
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
            PORT=${PORT}
            API_BASE_URL=${{ vars.API_BASE_URL }}
            API_MEDIA_URL=${{ vars.API_MEDIA_URL || vars.API_BASE_URL }}
            IMAGE_TAG=${IMAGE_TAG}
            COMPOSE_PROJECT_NAME=$(echo "${{ env.REPO_NAME }}-${SITE}" | tr '.' '_')
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_SHA=${{ github.sha }}
            GITHUB_RUN_ID=${{ github.run_id }}
            EOF

            docker compose -f docker-compose.production.yml up -d --remove-orphans

            # The loop must be able to FAIL. Without the explicit exit, every
            # probe can time out and the job still reports success — a green
            # deploy badge over a container that never came up.
            healthy=0
            for i in {1..20}; do
              if curl -fsS "http://127.0.0.1:${PORT}/api/health"; then
                healthy=1
                break
              fi
              sleep 3
            done
            if [ "$healthy" -ne 1 ]; then
              echo "::error::Health check never passed on port ${PORT} after 20 attempts (60s)."
              docker compose -f docker-compose.production.yml logs --tail=100 app || true
              exit 1
            fi
