name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site_config:
        description: 'Limit deploy to this site (blank = deploy all sites in matrix)'
        required: false

env:
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site:
          # Add a row per site. PORT must match the upstream in nginx.conf.<site>.
          - { config: coursecritic, port: 3005 }
          - { config: edsider, port: 3006 }
    steps:
      - name: Skip if workflow_dispatch targets a different site
        id: gate
        run: |
          INPUT="${{ github.event.inputs.site_config }}"
          if [ -n "$INPUT" ] && [ "$INPUT" != "${{ matrix.site.config }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Set up SSH
        if: steps.gate.outputs.skip == 'false'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Resolve deploy vars
        if: steps.gate.outputs.skip == 'false'
        run: |
          SAFE_REPO_NAME=$(echo "${REPO_NAME}" | tr '.' '_')
          echo "SAFE_REPO_NAME=${SAFE_REPO_NAME}" >> $GITHUB_ENV
          echo "BUILD_ID=$(date +%s)" >> $GITHUB_ENV
          echo "IMAGE_NAME=${REPO_NAME}-${{ matrix.site.config }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        if: steps.gate.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.gate.outputs.skip == 'false'
        run: |
          docker buildx build --platform=linux/amd64 --load \
            -t "${IMAGE_NAME}:${{ github.sha }}" \
            -t "${IMAGE_NAME}:latest" \
            --cache-from type=inline \
            --cache-to type=inline \
            --build-arg SITE_CONFIG="${{ matrix.site.config }}" \
            --build-arg PORT="${{ matrix.site.port }}" \
            --build-arg LOG_LEVEL="${{ vars.LOG_LEVEL || 'info' }}" \
            --build-arg API_BASE_URL="${{ vars.API_BASE_URL }}" \
            --build-arg API_MEDIA_URL="${{ vars.API_MEDIA_URL || vars.API_BASE_URL }}" \
            .

      - name: Stream image to VPS
        if: steps.gate.outputs.skip == 'false'
        run: |
          docker save "${IMAGE_NAME}:${{ github.sha }}" | gzip | \
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} 'gunzip | docker load'

      - name: Copy compose file
        if: steps.gate.outputs.skip == 'false'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: 'docker-compose.production.yml'
          target: '/opt/apps/${{ env.SAFE_REPO_NAME }}-${{ matrix.site.config }}'

      - name: Compose up on VPS
        if: steps.gate.outputs.skip == 'false'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            SITE="${{ matrix.site.config }}"
            PORT="${{ matrix.site.port }}"
            APP_DIR="/opt/apps/${{ env.SAFE_REPO_NAME }}-${SITE}"
            IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ github.sha }}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            cat > .env <<EOF
            NODE_ENV=production
            SITE_CONFIG=${SITE}
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
            PORT=${PORT}
            API_BASE_URL=${{ vars.API_BASE_URL }}
            API_MEDIA_URL=${{ vars.API_MEDIA_URL || vars.API_BASE_URL }}
            IMAGE_TAG=${IMAGE_TAG}
            COMPOSE_PROJECT_NAME=$(echo "${{ env.REPO_NAME }}-${SITE}" | tr '.' '_')
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_SHA=${{ github.sha }}
            GITHUB_RUN_ID=${{ github.run_id }}
            EOF

            docker compose -f docker-compose.production.yml up -d --remove-orphans

            for i in {1..20}; do
              curl -fsS "http://127.0.0.1:${PORT}/api/health" && break
              sleep 3
            done
